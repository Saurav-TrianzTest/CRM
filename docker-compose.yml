version: '3.8'

services:
  crm-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: crm-comp:latest
    container_name: crm-app
    ports:
      - "8080:8080"
    environment:
      # JVM Configuration
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport
      # Spring Boot Configuration
      - SPRING_PROFILES_ACTIVE=docker
      # Database Configuration (connect to external MySQL)
      - DB_HOST=${DB_HOST:-mysql-server}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-crm}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DDL_AUTO=${DDL_AUTO:-validate}
      # Actuator Configuration
      - MANAGEMENT_SECURITY_ENABLED=false
      - MANAGEMENT_CONTEXT_PATH=/appinfo
      # Thymeleaf Configuration
      - THYMELEAF_MODE=LEGACYHTML5
      - THYMELEAF_CACHE=false
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - crm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/appinfo/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  crm-network:
    driver: bridge

volumes:
  logs:
  config: