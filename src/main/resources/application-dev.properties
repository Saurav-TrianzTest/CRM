# Development Environment Configuration
spring.profiles.active=dev

# Local development database
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

# DDL auto for development
spring.jpa.hibernate.ddl-auto=create-drop

# Disable CloudWatch metrics in dev
management.metrics.export.cloudwatch.enabled=false

# Thymeleaf cache disabled for hot reload
spring.thymeleaf.cache=false

# Local S3 bucket for development (can use LocalStack)
cloud.aws.s3.bucket=crm-app-dev-bucket

# Verbose logging for development
logging.level.crm=DEBUG
logging.level.org.springframework.web=DEBUG
