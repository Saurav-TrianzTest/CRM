# Production Environment Configuration
spring.profiles.active=prod

# Production database - Use environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# DDL auto for production
spring.jpa.hibernate.ddl-auto=validate

# Enable CloudWatch metrics in production
management.metrics.export.cloudwatch.enabled=true
management.metrics.export.cloudwatch.namespace=crm-app-prod
management.metrics.export.cloudwatch.step=1m

# Thymeleaf cache enabled for performance
spring.thymeleaf.cache=true

# Production S3 bucket
cloud.aws.s3.bucket=${S3_BUCKET_NAME}

# Production AWS region
cloud.aws.region.static=${AWS_REGION}

# Production logging level
logging.level.crm=INFO
logging.level.org.springframework.web=WARN
