# Database Configuration - Use environment variables for cloud deployment
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crm?useSSL=true&requireSSL=true&verifyServerCertificate=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# Connection Pool Configuration for Cloud
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# Management Endpoints Security - Secured by default
management.security.enabled=${MANAGEMENT_SECURITY_ENABLED:true}
management.context-path=${MANAGEMENT_CONTEXT_PATH:/actuator}

# Health Check Configuration
management.health.db.enabled=true
management.endpoints.web.exposure.include=health,info,metrics

# Thymeleaf Configuration - Cloud-ready settings
spring.thymeleaf.mode=${THYMELEAF_MODE:HTML}
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# Cloud Storage Configuration
cloud.storage.enabled=${CLOUD_STORAGE_ENABLED:true}
cloud.storage.bucket=${CLOUD_STORAGE_BUCKET:crm-pdfs}
