
# Cloud-native database configuration using environment variables
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}

# AWS S3 Configuration for cloud-native file storage
# These should be set via environment variables in cloud deployments
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:crm-pdf-storage}
aws.s3.pdf.prefix=${AWS_S3_PDF_PREFIX:pdfs/}
aws.s3.csv.prefix=${AWS_S3_CSV_PREFIX:csv/}

# AWS Region Configuration
aws.region=${AWS_REGION:us-east-1}

# Timezone standardization - use UTC for all operations
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false
