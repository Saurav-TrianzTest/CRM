spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false
management.context-path=/appinfo

spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# -----------------------------------------------------------------------
# AWS S3 Configuration (cloud-native storage – replaces local file system)
# Set these environment variables in your cloud deployment environment:
#   AWS_REGION            – e.g. us-east-1
#   AWS_S3_BUCKET_NAME    – target S3 bucket for PDFs and CSV files
#   AWS_S3_CSV_OBJECT_KEY – S3 object key for the input CSV file
# AWS credentials are resolved automatically via the SDK credential chain
# (IAM role, environment variables, or ~/.aws/credentials).
# -----------------------------------------------------------------------
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:}
aws.s3.csv-object-key=${AWS_S3_CSV_OBJECT_KEY:data/input.csv}
aws.region=${AWS_REGION:us-east-1}
