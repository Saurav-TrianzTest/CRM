# Database Configuration - Use environment variables for cloud deployment
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:create-drop}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}

# Management endpoints
management.security.enabled=false
management.context-path=/appinfo

# Thymeleaf Configuration
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# Google Cloud Storage Configuration
# These should be set via environment variables in cloud deployment
gcs.bucket.name=${GCS_BUCKET_NAME:default-crm-bucket}
gcs.project.id=${GCS_PROJECT_ID:}
gcs.pdf.folder=${GCS_PDF_FOLDER:pdfs/}
gcs.csv.folder=${GCS_CSV_FOLDER:csv/}

# Timezone Configuration - Standardize on UTC for cloud environments
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC

# User timezone context (for display purposes only, not business logic)
user.timezone=${USER_TIMEZONE:UTC}
