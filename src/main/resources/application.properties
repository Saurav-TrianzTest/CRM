# Database Configuration - Externalized for Cloud Environments
# Use environment variables for sensitive configuration
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:create-drop}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# Management/Actuator Configuration
management.security.enabled=false
management.context-path=/appinfo

# Thymeleaf Configuration
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# Cloud-Ready File Storage Configuration
# PDF Storage Path - Configure to point to Amazon EFS mount
pdf.storage.path=${PDF_STORAGE_PATH:/mnt/efs/pdfs}

# CSV Storage Path - Configure to point to Amazon EFS mount
csv.storage.path=${CSV_STORAGE_PATH:/mnt/efs/csv}

# AWS Configuration
# Region can be auto-detected from EC2 instance metadata or set explicitly
aws.region=${AWS_REGION:us-east-1}

# Timezone Configuration - Standardize on UTC for cloud deployments
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging Configuration for Cloud Environments
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.crm=INFO
logging.level.org.springframework.web=INFO
