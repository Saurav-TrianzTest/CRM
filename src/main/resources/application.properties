spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false

# Azure Blob Storage Configuration (cloud-native file storage)
# Replace with your Azure Storage connection string
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:crm-files}

# Azure Service Bus Configuration (for distributed scheduling)
# Replace with your Azure Service Bus connection string
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME:scheduled-tasks}

# Application Timezone Configuration (cloud-native time handling)
# Use UTC for cloud environments to avoid timezone issues
app.timezone=${APP_TIMEZONE:UTC}
spring.thymeleaf.cache=false
