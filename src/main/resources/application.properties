# Database Configuration - Use environment variables for cloud deployment
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:create-drop}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}

# Management/Actuator Configuration
management.security.enabled=false
management.context-path=/appinfo

# Thymeleaf Configuration
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# AWS S3 Configuration - Set via environment variables in cloud deployment
# S3_BUCKET_NAME=crm-data-bucket
# S3_PDF_PREFIX=pdfs/
# S3_CSV_KEY=csv/data.csv
# AWS_REGION=us-east-1

# Cloud-ready configuration
# All sensitive data and environment-specific values should be provided via environment variables
# Example AWS environment variables:
# - AWS_ACCESS_KEY_ID (automatically used by AWS SDK)
# - AWS_SECRET_ACCESS_KEY (automatically used by AWS SDK)
# - AWS_REGION (automatically used by AWS SDK)
