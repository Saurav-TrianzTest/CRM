# Database Configuration - Use environment variables for cloud deployment
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# HikariCP Connection Pool for cloud environments
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# Actuator Configuration - Secured for production
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.export.cloudwatch.enabled=${CLOUDWATCH_METRICS_ENABLED:true}
management.metrics.export.cloudwatch.namespace=${CLOUDWATCH_NAMESPACE:crm-app}

# Thymeleaf Configuration
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# AWS Configuration
cloud.aws.region.static=${AWS_REGION:us-east-1}
cloud.aws.s3.bucket=${S3_BUCKET_NAME:crm-app-bucket}

# Server Configuration
server.port=${SERVER_PORT:8080}
