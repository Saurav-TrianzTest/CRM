spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:crm}?useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

management.security.enabled=${MANAGEMENT_SECURITY_ENABLED:false}
management.context-path=${MANAGEMENT_CONTEXT_PATH:/appinfo}

spring.thymeleaf.mode=${THYMELEAF_MODE:LEGACYHTML5}
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
