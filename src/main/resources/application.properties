# Database Configuration - Use environment variables for cloud deployment
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}
# Actuator Configuration
# Thymeleaf Configuration

# AWS S3 Configuration for cloud-native storage
# These values should be set via environment variables in cloud deployments
aws.s3.bucket.name=${S3_BUCKET_NAME:crm-data-bucket}
aws.s3.pdf.bucket.name=${S3_PDF_BUCKET_NAME:crm-pdf-bucket}
aws.region=${AWS_REGION:us-east-1}

# Timezone Configuration - Standardize on UTC for cloud consistency
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging Configuration for cloud environments
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.level.crm=INFO
