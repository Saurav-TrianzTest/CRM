spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false
management.context-path=/appinfo

spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# -----------------------------------------------------------------------
# AWS S3 Configuration (cloud-native file storage)
# These values are resolved from environment variables at runtime.
# Set AWS_REGION, AWS_S3_BUCKET_NAME in your cloud environment / ECS task
# definition / EC2 instance profile.  Credentials are supplied via the
# default AWS credential provider chain (IAM role recommended for cloud).
# -----------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:crm-pdf-storage}
aws.s3.pdf-prefix=${AWS_S3_PDF_PREFIX:pdfs/}
