# Database Configuration - Externalized via Environment Variables
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# Connection Pool Configuration for Cloud
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# Actuator Security Configuration
management.security.enabled=false
management.context-path=/appinfo

# Thymeleaf Configuration
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# Cloud Storage Configuration for PDF Generation
cloud.storage.enabled=${CLOUD_STORAGE_ENABLED:false}
cloud.storage.bucket=${S3_BUCKET_NAME:crm-pdfs}
cloud.storage.region=${AWS_REGION:us-east-1}
