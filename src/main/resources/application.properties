spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false
management.context-path=/appinfo

# -----------------------------------------------------------------------
# AWS S3 Configuration (cloud-native storage - replaces local file system)
# These values are resolved from environment variables in cloud deployments.
# Set AWS_REGION, AWS_S3_BUCKET_NAME in your cloud environment / secrets manager.
# -----------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:crm-pdf-storage}
aws.s3.pdf-prefix=${AWS_S3_PDF_PREFIX:pdfs/}

# AWS credentials are provided via IAM instance profile / ECS task role in cloud.
# For local development set: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY env vars.
