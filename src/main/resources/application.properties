spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false
management.context-path=/appinfo

spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# -----------------------------------------------------------------------
# Azure Blob Storage configuration (cloud-native file storage)
# Set these as environment variables in your Azure deployment:
#   AZURE_STORAGE_CONNECTION_STRING  – Azure Storage account connection string
#   AZURE_BLOB_CONTAINER_NAME        – Blob container name for PDF/CSV storage
#   AZURE_CSV_BLOB_NAME              – Default CSV blob name (optional, defaults to data.csv)
# -----------------------------------------------------------------------
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.blob.container-name=${AZURE_BLOB_CONTAINER_NAME:crm-storage}
azure.csv.blob-name=${AZURE_CSV_BLOB_NAME:data.csv}

# -----------------------------------------------------------------------
# Azure Service Bus configuration (cloud-native distributed scheduling)
# Set these as environment variables in your Azure deployment:
#   AZURE_SERVICE_BUS_CONNECTION_STRING – Service Bus namespace connection string
#   AZURE_SERVICE_BUS_QUEUE_NAME        – Queue or topic name for scheduled tasks
# -----------------------------------------------------------------------
azure.servicebus.connection-string=${AZURE_SERVICE_BUS_CONNECTION_STRING:}
azure.servicebus.queue-name=${AZURE_SERVICE_BUS_QUEUE_NAME:crm-tasks}
