spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false
management.context-path=/appinfo

spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# Azure Blob Storage configuration for cloud-native file persistence
# Set AZURE_STORAGE_CONNECTION_STRING environment variable with your Azure Storage connection string

# -----------------------------------------------------------------------
# Azure Service Bus configuration for cloud-native distributed scheduling
# (cr-java-0111 - Clock/Time Dependencies fix)
# Replaces java.util.Timer / server-local scheduling with Azure Service Bus
# Scheduled Messages for timezone-agnostic, distributed task execution.
# Set AZURE_SERVICEBUS_CONNECTION_STRING and AZURE_SERVICEBUS_QUEUE_NAME
# environment variables in your Azure deployment configuration.
# -----------------------------------------------------------------------
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME:scheduled-tasks}
