# Cloud-ready configuration using environment variables
# Database configuration - externalized for cloud deployment
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}

# Management endpoints
management.security.enabled=false
management.context-path=/appinfo

# Thymeleaf configuration
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# AWS S3 Configuration (via environment variables)
# S3_BUCKET_NAME - S3 bucket for file storage
# AWS_REGION - AWS region for S3 and other services
# AWS credentials should be provided via IAM roles or environment variables

# Timezone standardization - use UTC for all operations
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
