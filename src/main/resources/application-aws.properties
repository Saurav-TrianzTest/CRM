# AWS-specific configuration profile
# Activate this profile in cloud: spring.profiles.active=aws

# Database configuration for AWS RDS
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crm?useSSL=true&requireSSL=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Connection pooling optimized for cloud
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1200000}

# Do not auto-create schema in production
spring.jpa.hibernate.ddl-auto=validate

# Production caching enabled
spring.thymeleaf.cache=true

# PDF storage - use S3 bucket or EFS mount
pdf.storage.path=${PDF_STORAGE_PATH:/mnt/efs/pdfs}

# Server configuration
server.port=${SERVER_PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json

# Management endpoints
management.security.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# Logging configuration for CloudWatch
logging.level.root=${LOG_LEVEL:INFO}
logging.level.crm=${APP_LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Security headers
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
