# Cloud-specific configuration for AWS deployment
# This profile should be activated in cloud environments using SPRING_PROFILES_ACTIVE=cloud

# Database Configuration - Use RDS endpoint
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HikariCP Connection Pool - Optimized for cloud
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA Configuration
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Management Endpoints - Secured
management.security.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# Server Configuration
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json

# Thymeleaf - Production settings
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=true

# Cloud Storage Configuration
cloud.storage.enabled=true
cloud.storage.bucket=${S3_BUCKET_NAME:crm-pdfs}
cloud.storage.region=${AWS_REGION:us-east-1}

# Logging Configuration
logging.level.root=INFO
logging.level.crm=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
