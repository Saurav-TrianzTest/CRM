# Cloud-specific configuration for AWS deployment

# Database configuration for cloud (use RDS endpoint)
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crm?useSSL=true&requireSSL=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HikariCP connection pooling optimized for cloud
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}
spring.datasource.hikari.connection-test-query=SELECT 1

# Server configuration
server.port=${PORT:8080}
server.shutdown=graceful
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# Actuator configuration for cloud monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Thymeleaf caching enabled for performance
spring.thymeleaf.cache=true

# File storage configuration (use S3 or EFS in production)
pdf.storage.path=${PDF_STORAGE_PATH:/tmp/pdfs}
file.storage.path=${FILE_STORAGE_PATH:/tmp/files}

# Logging
logging.level.root=INFO
logging.level.crm=INFO
